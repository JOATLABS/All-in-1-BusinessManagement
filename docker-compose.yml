version: '3.8'

services:
  # PostgreSQL database for local development
  postgres:
    image: postgres:15-alpine
    container_name: ojaplus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Database credentials (matches backend/.env.example)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ojaplus
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: Initialize database with seed data on first start
      - ./backend/data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check if database is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ojaplus-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ojaplus.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  # Named volumes for data persistence
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
