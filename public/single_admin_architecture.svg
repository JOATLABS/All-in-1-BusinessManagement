<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Single Admin Architecture Overview</title>
  <desc id="desc">Diagram illustrating the single-admin deployment with customer site, admin console, API, databases, storage, and third-party services.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill:#ffffff; stroke:#111827; stroke-width:2; rx:12; ry:12; }
      .label { font-family:'Inter', 'Segoe UI', Arial, sans-serif; font-size:18px; fill:#111827; font-weight:600; }
      .sub { font-family:'Inter', 'Segoe UI', Arial, sans-serif; font-size:14px; fill:#374151; }
      .group-title { font-family:'Inter', 'Segoe UI', Arial, sans-serif; font-size:16px; fill:#4338ca; font-weight:700; }
      .arrow { stroke:#2563eb; stroke-width:2.5; marker-end:url(#arrowhead); fill:none; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="40" y="40" width="320" height="520" fill="#eef2ff" stroke="#4338ca" stroke-width="2" rx="16" ry="16" />
  <text x="60" y="70" class="group-title">Customer Experience</text>
  <rect x="60" y="100" width="280" height="120" class="box" />
  <text x="80" y="130" class="label">Next.js Marketing Site</text>
  <text x="80" y="160" class="sub">Static + ISR pages</text>
  <text x="80" y="185" class="sub">Stripe Checkout redirects</text>
  <rect x="60" y="240" width="280" height="120" class="box" />
  <text x="80" y="270" class="label">Guest Reservation Widget</text>
  <text x="80" y="300" class="sub">Requests &amp; tracking</text>
  <text x="80" y="325" class="sub">Ticket wallet &amp; QR display</text>
  <rect x="60" y="380" width="280" height="120" class="box" />
  <text x="80" y="410" class="label">Door Staff App</text>
  <text x="80" y="440" class="sub">Offline allowlist</text>
  <text x="80" y="465" class="sub">QR validation</text>

  <rect x="360" y="40" width="260" height="520" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="16" ry="16" />
  <text x="380" y="70" class="group-title" fill="#047857">Admin Operations</text>
  <rect x="380" y="100" width="220" height="120" class="box" />
  <text x="400" y="130" class="label">Admin Console</text>
  <text x="400" y="160" class="sub">Content &amp; contracts</text>
  <text x="400" y="185" class="sub">Inventory, ticketing</text>
  <rect x="380" y="240" width="220" height="120" class="box" />
  <text x="400" y="270" class="label">Embedded eSignature</text>
  <text x="400" y="300" class="sub">DocuSign / Adobe Sign</text>
  <text x="400" y="325" class="sub">Status webhooks</text>
  <rect x="380" y="380" width="220" height="160" class="box" />
  <text x="400" y="410" class="label">Notification Hub</text>
  <text x="400" y="440" class="sub">Slack, Email, SMS</text>
  <text x="400" y="465" class="sub">PagerDuty / Opsgenie</text>
  <text x="400" y="490" class="sub">Audit log persistence</text>

  <rect x="640" y="40" width="280" height="520" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="16" ry="16" />
  <text x="660" y="70" class="group-title" fill="#b45309">Platform Services</text>
  <rect x="660" y="100" width="240" height="100" class="box" />
  <text x="680" y="130" class="label">API Gateway / BFF</text>
  <text x="680" y="160" class="sub">Next.js Route Handlers</text>
  <text x="680" y="185" class="sub">tRPC / REST adapters</text>
  <rect x="660" y="220" width="240" height="100" class="box" />
  <text x="680" y="250" class="label">PostgreSQL</text>
  <text x="680" y="275" class="sub">Contracts, reservations</text>
  <text x="680" y="300" class="sub">Tickets, audit logs</text>
  <rect x="660" y="340" width="240" height="100" class="box" />
  <text x="680" y="370" class="label">Redis Queues &amp; Cache</text>
  <text x="680" y="395" class="sub">Reminders, rate limiting</text>
  <rect x="660" y="460" width="240" height="100" class="box" />
  <text x="680" y="490" class="label">Object Storage + CDN</text>
  <text x="680" y="515" class="sub">Contracts, QR manifests</text>

  <rect x="140" y="220" width="0" height="0" fill="none" stroke="none" />

  <line x1="340" y1="160" x2="380" y2="160" class="arrow" />
  <line x1="340" y1="300" x2="380" y2="300" class="arrow" />
  <line x1="340" y1="440" x2="380" y2="440" class="arrow" />

  <line x1="600" y1="160" x2="660" y2="150" class="arrow" />
  <line x1="600" y1="300" x2="660" y2="270" class="arrow" />
  <line x1="600" y1="460" x2="660" y2="420" class="arrow" />

  <line x1="640" y1="150" x2="340" y2="150" class="arrow" />
  <line x1="640" y1="290" x2="340" y2="290" class="arrow" />
  <line x1="640" y1="440" x2="340" y2="440" class="arrow" />

  <rect x="700" y="20" width="200" height="0" fill="none" stroke="none" />

  <rect x="700" y="200" width="200" height="0" fill="none" stroke="none" />

  <rect x="720" y="20" width="0" height="0" fill="none" stroke="none" />

  <rect x="720" y="200" width="0" height="0" fill="none" stroke="none" />

  <rect x="700" y="560" width="200" height="0" fill="none" stroke="none" />

  <rect x="720" y="560" width="0" height="0" fill="none" stroke="none" />

  <rect x="720" y="400" width="0" height="0" fill="none" stroke="none" />

  <rect x="700" y="400" width="200" height="0" fill="none" stroke="none" />

  <text x="660" y="560" class="sub">Integrations: Stripe, DocuSign, Slack, Twilio, PagerDuty</text>
</svg>
